# cargo-deny configuration — v2 schema
# https://embarkstudios.github.io/cargo-deny/

[advisories]
# In v2, vulnerability advisories always emit errors (not configurable).
# unmaintained: scope of unmaintained-crate checks (all | workspace | transitive | none)
unmaintained = "all"
# yanked: deny | warn | allow
yanked = "deny"
# Ignore known unmaintained/unsound transitive deps we cannot easily replace.
# Each entry cites (a) the crate, (b) the upstream chain blocking the upgrade,
# and (c) why the risk is acceptable for our usage.
# When you add an id here, add it to .github/workflows/sec-audit.yml too.
ignore = [
    # SECURITY (2026-08-20 supply-chain incident): arrayref 0.3.9 is YANKED, but
    # EVERY legitimate version (0.3.5–0.3.9) was yanked the same day to force an
    # "update" onto a trojaned 0.3.10 — it declares a dependency on `proc-macro1`,
    # a proc-macro2 typosquat published the same day that pulls an HTTP client
    # (ureq) + rustls to exfiltrate at compile time. 0.3.9 is the last known-good
    # release (crates.io versions are immutable — a yank cannot alter its bytes)
    # and is pinned EXACTLY in Cargo.toml so no build can resolve forward to
    # 0.3.10. Suppress the yanked check for THIS version only; the pin is the real
    # mitigation. REMOVE (and unpin Cargo.toml) once arrayref publishes a
    # verified-clean release. Reached transitively via blake3 + wa-rs-libsignal.
    "arrayref@0.3.9",
    # chacha20 0.10.0 was YANKED upstream (RustCrypto), flagged by cargo-deny's
    # yanked check — NOT a RUSTSEC vulnerability. Two pull paths in the current
    # lockfile: rand 0.10.3 (its default ChaCha RNG), which rantaiclaw depends on
    # directly and which lopdf 0.42 (via pdf-extract) and russh 0.63 (directly,
    # and via num-bigint) also pull, and ssh-cipher 0.3 (via ssh-key), which
    # russh 0.63 pulls separately. crates.io bytes are immutable, so the yanked
    # version is byte-identical to when it was published. A non-yanked 0.10.2 is
    # in range, but moving the lockfile to it is deliberately deferred as a
    # separate concern; REMOVE this entry when that bump lands.
    "chacha20@0.10.0",
    # zip 8.6.0 is reached only through docx-rs 0.4.22 (latest release,
    # 2026-07-21), which requires zip ^8.6.0, behind the opt-in `kb-office`
    # feature. calamine 0.38.0 requires zip ^9 and is not on this path.
    # On 2026-11-07 the crates.io index does not flag 8.6.0 as yanked, so
    # cargo-deny reports this entry as unused. The entry stays in the list
    # because the yanked status was real when it was written, and it is cheap
    # to keep until docx-rs moves to zip 9.
    #
    # A crate spec here suppresses ONLY the yanked status. Verified on
    # cargo-deny 0.20.2 with a synthetic zip 8.6.0 advisory injected into the
    # local advisory db: with this entry present that advisory still errors,
    # so advisories are NOT suppressed (they are matched by RUSTSEC id, which
    # this entry does not list). RUSTSEC-2025-0168 / CVE-2025-29787, the
    # advisory this entry was written against, is patched in >= 2.3.0 and so
    # does not affect 8.6.0. RUSTSEC-2026-0367, -0368, -0369 and -0429 do
    # affect 8.6.0; they are waived by id in the advisory ignore list below.
    #
    # REVIEW BY 2026-12-15: remove once docx-rs accepts zip 9 and the lockfile
    # picks it up.
    { crate = "zip@8.6.0", reason = "reached only through docx-rs 0.4.22 (opt-in kb-office, requires zip ^8.6.0); the crates.io index does not flag 8.6.0 yanked (checked 2026-11-07), so cargo-deny reports this entry unused; the four extract() advisories (RUSTSEC-2026-0367, -0368, -0369, -0429) are waived by RUSTSEC id below; fixed when docx-rs accepts zip 9 (latest zip 9.4.1, latest docx-rs 0.4.22, checked 2026-11-07); REVIEW BY 2026-12-15" },
    # rsa 0.10.0-rc.18 (Marvin timing sidechannel), pulled by russh 0.65.1 in the
    # default-on `remote-install` ssh/pty tools, so every default build carries it.
    # It is a client-side advisory against hosts the operator explicitly targets
    # (TOFU known-hosts), not a multi-tenant key-extraction surface. The advisory
    # lists no patched version, and the newest rsa (0.10.0-rc.18) is still affected.
    # Revisit when rsa publishes a fix.
    "RUSTSEC-2023-0071",
    # proc-macro-error2 v2.0.1, pulled by defmt-macros 1.1.0 (a proc macro,
    # build-time only, no runtime surface) through defmt 1.1.0. cargo-deny does
    # not match this id because its graph has no path to the dependent, but
    # cargo audit reads the whole Cargo.lock and still reports it, so the id
    # stays in this list and in sec-audit.yml. Fixed by defmt 1.2.0, whose
    # defmt-macros 1.2.0 no longer depends on proc-macro-error2 (latest defmt
    # and defmt-macros are 1.2.0, checked 2026-11-07; the lock keeps 1.1.0).
    #
    # REVIEW BY 2026-12-15: the defmt bump clears it; re-check the release list then.
    "RUSTSEC-2026-0173",
    # derivative v2.2.0, unmaintained; 2.2.0 is the final release. Path in the
    # lock: matrix-sdk 0.19.1 → matrix-sdk-indexeddb → matrix_indexed_db_futures
    # 0.7.0 → wasm_evt_listener 0.1.0 → derivative. That path exists only for
    # the IndexedDB store, which the native `channel-matrix` features
    # (`e2e-encryption`, `markdown`) leave off, and `cargo tree -i derivative
    # --all-features` prints nothing on native targets, so no default or native
    # build contains it. cargo-deny does not match this id for the same reason
    # as RUSTSEC-2026-0173; cargo audit still reports it. Fixed when
    # wasm_evt_listener and matrix_indexed_db_futures drop derivative. No fixed
    # release yet (both are the latest releases, checked 2026-11-07).
    #
    # REVIEW BY 2026-12-15 with RUSTSEC-2026-0319 below, the other matrix-sdk-family entry.
    "RUSTSEC-2024-0388",
    # anymap2 v0.13.0, RUSTSEC-2026-0319, flagged unmaintained, not a
    # vulnerability; there is no patched version, and the recommended
    # replacement is `anymap3`. Path: anymap2 0.13.0 ← matrix-sdk 0.19.1 ←
    # rantaiclaw, reachable only through the opt-in `channel-matrix` feature;
    # `cargo tree -i anymap2` matches no package with default features, so no
    # default or released build contains it. An unmaintained type-map crate has
    # no known flaw to trigger, and switching to `anymap3` is matrix-sdk's
    # choice, not ours. Fixed by a matrix-sdk release that no longer depends on
    # anymap2. No such release yet: matrix-sdk 0.19.1 is the latest and still
    # depends on it (checked 2026-11-07).
    #
    # REVIEW BY 2026-12-15 with the other matrix-sdk-family entries above.
    "RUSTSEC-2026-0319",
    # ttf-parser v0.25 via lopdf 0.42 → pdf-extract (KB PDF text extraction) —
    # font parser flagged unmaintained; parse-only path over operator-supplied
    # documents, no fixed release (lopdf 0.42 is current). Revisit on a lopdf bump.
    "RUSTSEC-2026-0192",
    # zip 8.6.0: RUSTSEC-2026-0367, RUSTSEC-2026-0368, RUSTSEC-2026-0369 and
    # RUSTSEC-2026-0429 (patched only in >= 9.0.0). All four concern
    # `ZipArchive::extract()` / `ZipStreamReader::extract()`, which unpack
    # archive entries to disk. RUSTSEC-2026-0429 is the one where
    # `ZipArchive::extract()` aborts the process on a symlink entry with a large
    # declared size. Nothing in `src/` calls the zip crate directly. The only
    # path to zip 8.6.0 is docx-rs 0.4.22 behind the opt-in `kb-office` feature,
    # which reads entries into memory through `ZipArchive<Cursor<&[u8]>>` and
    # never calls `extract`. calamine 0.38.0 uses zip 9.3.0, which is patched,
    # so it is not on this path. No default build contains zip at all. Fixed
    # when docx-rs accepts zip >= 9; latest docx-rs is still 0.4.22, which
    # requires ^8.6.0 (checked 2026-11-07).
    #
    # REVIEW BY 2026-12-15: drop these four ids once docx-rs accepts zip 9 and
    # the lockfile picks it up.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    "RUSTSEC-2026-0429",
    # pin-utils v0.1.0 — RUSTSEC-2026-0441, unmaintained (INFO — notice only,
    # no vulnerability): the upstream repository was archived on 2026-10-01 and
    # the advisory lists no patched version, so no lockfile bump clears it.
    # Reached transitively by every build: async-imap 0.12.0 pulls it directly,
    # and hyper 1.8.1 pulls it for its futures integration. axum 0.8.9 and
    # reqwest 0.12.28 / 0.13.5 reach it through hyper (`cargo tree -i pin-utils`
    # confirms this). The crate
    # is a compile-time pinning helper (a handful of macros) consumed by
    # futures-macro; it ships no runtime service, I/O or untrusted-input
    # surface of its own.
    #
    # Revisit when a futures-util or hyper release drops the dependency, or on
    # the async-imap upgrade already queued upstream (checked 2026-11-05: the
    # hyper 1.8 chain keeps it either way).
    "RUSTSEC-2026-0441",
]

[licenses]
# All licenses are denied unless explicitly allowed
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "0BSD",
    "BSL-1.0",
    # CC0-1.0 (Creative Commons Zero) is a public-domain dedication, FSF
    # Free/Libre, more permissive than MIT (no attribution required).
    # Used by `notify` 8.x (hot-reload watcher).
    "CC0-1.0",
]
unused-allowed-license = "allow"

# RantaiClaw itself is AGPL-3.0-only (see LICENSE). It is scoped as a per-crate
# exception rather than added to `allow` above, because `allow` governs what we
# accept from *dependencies* — a copyleft entry there would let an AGPL crate
# enter the tree unnoticed and bind downstream consumers.
[[licenses.exceptions]]
name = "rantaiclaw"
allow = ["AGPL-3.0-only"]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
