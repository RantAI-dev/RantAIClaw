# cargo-deny configuration — v2 schema
# https://embarkstudios.github.io/cargo-deny/

[advisories]
# In v2, vulnerability advisories always emit errors (not configurable).
# unmaintained: scope of unmaintained-crate checks (all | workspace | transitive | none)
unmaintained = "all"
# yanked: deny | warn | allow
yanked = "deny"
# Ignore known unmaintained/unsound transitive deps we cannot easily replace.
# Each entry cites (a) the crate, (b) the upstream chain blocking the upgrade,
# and (c) why the risk is acceptable for our usage.
# When you add an id here, add it to .github/workflows/sec-audit.yml too.
ignore = [
    # SECURITY (2026-08-20 supply-chain incident): arrayref 0.3.9 is YANKED, but
    # EVERY legitimate version (0.3.5–0.3.9) was yanked the same day to force an
    # "update" onto a trojaned 0.3.10 — it declares a dependency on `proc-macro1`,
    # a proc-macro2 typosquat published the same day that pulls an HTTP client
    # (ureq) + rustls to exfiltrate at compile time. 0.3.9 is the last known-good
    # release (crates.io versions are immutable — a yank cannot alter its bytes)
    # and is pinned EXACTLY in Cargo.toml so no build can resolve forward to
    # 0.3.10. Suppress the yanked check for THIS version only; the pin is the real
    # mitigation. REMOVE (and unpin Cargo.toml) once arrayref publishes a
    # verified-clean release. Reached transitively via blake3 + wa-rs-libsignal.
    "arrayref@0.3.9",
    # chacha20 0.10.0 was YANKED upstream (RustCrypto), flagged by cargo-deny's
    # yanked check — NOT a RUSTSEC vulnerability. Two pull paths in the current
    # lockfile: rand 0.10.3 (its default ChaCha RNG), which rantaiclaw depends on
    # directly and which lopdf 0.42 (via pdf-extract) and russh 0.63 (via
    # num-bigint) also pull, and ssh-cipher 0.3 (via ssh-key), which russh 0.63
    # pulls separately. crates.io bytes are immutable, so the yanked version is
    # byte-identical to when it was published. A non-yanked 0.10.2 is in range,
    # but moving the lockfile to it is deliberately deferred as a separate
    # concern; REMOVE this entry when that bump lands.
    "chacha20@0.10.0",
    # zip 8.6.0 was YANKED upstream together with EVERY 7.x/8.x release
    # (checked 2026-10-16; only 9.0.3 remains, and that is a major bump).
    # Reached via calamine 0.36.1 and docx-rs 0.4.22 (opt-in `kb-office`),
    # which pin zip ^8.6, so no in-range non-yanked release exists.
    # crates.io bytes are immutable, so the yanked version is byte-identical to
    # when it was published.
    #
    # A crate spec here suppresses ONLY the yanked status. Verified on
    # cargo-deny 0.20.2 with a synthetic zip 8.6.0 advisory injected into the
    # local advisory db: with this entry present that advisory still errors,
    # so advisories are NOT suppressed (they are matched by RUSTSEC id, which
    # this entry does not list). RUSTSEC-2025-0168 / CVE-2025-29787, the
    # advisory this entry was written against, is patched in >= 2.3.0 and so
    # does not affect 8.6.0. Since 2026-10-17 three further advisories do
    # affect 8.6.0: RUSTSEC-2026-0367, -0368 and -0369, all about `extract()`
    # unpacking archive entries to disk. Those three are waived by id in the
    # advisory ignore list below, not by this entry.
    #
    # REMOVE once calamine and docx-rs both accept zip 9 and the lockfile picks
    # it up (or 8.6.0 is un-yanked).
    { crate = "zip@8.6.0", reason = "no in-range non-yanked zip exists: yanked with every 7.x/8.x release (checked 2026-10-16, only 9.0.3 remains); calamine 0.36.1 and docx-rs 0.4.22 pin ^8.6; the three 2026-10 extract() advisories are waived by RUSTSEC id in the advisory ignore; remove once both accept zip 9" },
    # bitmaps v3.2.1 — unsound `Bitmap::try_from(&[u8])`, no patched version.
    # Reached only through the opt-in `channel-matrix` feature via matrix-sdk 0.18
    # → imbl 6.1.0 → bitmaps (verified: `cargo tree -i bitmaps` with default
    # features matches nothing); no patched upstream exists.
    #
    # REVIEW BY 2026-11-15 with the RUSTSEC-2026-0247 / imbl-sized-chunks block
    # below — same root (bitmaps via imbl via matrix-sdk), same decision.
    "RUSTSEC-2025-0167",
    # bitmaps v3.2.1 via matrix-sdk 0.16 → imbl / imbl-sized-chunks — the
    # crate is declared unmaintained (notice only, no vulnerability). It
    # implements fixed-size bitmap ops with no I/O and no untrusted-input
    # surface in our usage. Unblocks when matrix-sdk moves off imbl.
    #
    # REVIEW BY 2026-11-15. Reached only through `channel-matrix`, which ships in
    # no release binary — so this suppresses an advisory for code no default
    # build contains. It DOES compile again as of the `matrix-sdk` 0.18 pin
    # (plan 304), which removes the "code no user runs" half of the old
    # justification: an operator who builds `--features channel-matrix` now runs
    # it. The path is unchanged — bitmaps via imbl via eyeball-im via matrix-sdk.
    # The 2026-08-14 write-up (§5.1) recorded a fork/pin/drop choice that the
    # 0.18 bump answered differently; on the review date, re-make it against the
    # current graph rather than re-defer.
    "RUSTSEC-2026-0247",
    # quick-xml v0.36 via docx-rs 0.4 (opt-in `kb-office` DOCX ingestion only).
    # Both are DoS-class (quadratic duplicate-attribute check; unbounded
    # namespace-declaration allocation), patched in quick-xml >= 0.41 — but the
    # latest docx-rs (0.4.20) still requires ^0.36, so no fixed upstream exists.
    # The calamine (xlsx) path is really fixed: calamine 0.36 uses quick-xml
    # 0.41. Input is operator-provided documents, not a network surface.
    # Revisit on a docx-rs release that moves to quick-xml >= 0.41.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # rsa 0.10.0-rc.16 (Marvin timing sidechannel), pulled only by russh 0.60 in the
    # default-on `remote-install` ssh/pty tools, so every default build carries it.
    # It is a client-side advisory against hosts the operator explicitly targets
    # (TOFU known-hosts), not a multi-tenant key-extraction surface. The advisory
    # lists no patched version, and the newest rsa (0.10.0-rc.18) is still affected.
    # Revisit when rsa publishes a fix.
    "RUSTSEC-2023-0071",
    # proc-macro-error2 v2.0.1 via matrix-sdk → aquamarine (doc-comment macro) —
    # build-time only, no runtime surface, no safe upgrade published upstream.
    #
    # REVIEW BY 2026-11-15, with RUSTSEC-2026-0247 above — same root, same
    # decision. See docs/project/2026-08-14-dependency-decisions.md §5.1.
    "RUSTSEC-2026-0173",
    # imbl-sized-chunks 0.1.3 via matrix-sdk 0.18 → imbl 6.1.0 — same root as
    # RUSTSEC-2026-0247 above (bitmaps/unmaintained). This is the new
    # use-after-free / double-free advisory against `Chunk::{clear, drop_left,
    # drop_right}` and `InlineArray::{clear, truncate}` reachable from safe Rust
    # when an element's `Drop` panics during the drop. The trigger is a
    # panicking Drop impl, which is not a pattern our code or matrix-sdk's
    # internal types exhibit; the fix is upstream imbl-sized-chunks >=0.2.0,
    # but matrix-sdk 0.18 pins imbl 6.1.0 (which pulls 0.1.3) and has not
    # released a version with the fix. Same opt-in surface as RUSTSEC-2026-0247:
    # only reachable through `channel-matrix`, not in default builds.
    #
    # REVIEW BY 2026-11-15 with the other imbl/matrix-sdk entries. Revisit on a
    # matrix-sdk release that updates imbl past 6.1.0.
    "RUSTSEC-2026-0292",
    # derivative v2.2.0 — unmaintained, no maintained replacement; 2.2.0 is the
    # final release. Reaches Cargo.lock only through the matrix-sdk →
    # matrix_indexed_db_futures → wasm_evt_listener → derivative chain, which
    # only resolves when matrix-sdk builds its IndexedDB store; with our
    # `channel-matrix` features (`e2e-encryption`, `markdown`) the indexeddb
    # half is off, and `cargo tree -i derivative --all-features` prints nothing
    # on native targets — so no default or native build contains it. Dropping
    # it needs an upstream matrix-sdk ecosystem change, not a lockfile bump.
    #
    # REVIEW BY 2026-11-15 with the other matrix-sdk-family entries above.
    "RUSTSEC-2024-0388",
    # matrix-sdk-crypto v0.18.0 — RUSTSEC-2026-0318, "Sending custom to-device
    # messages may panic", patched in >=0.19.0 (upstream fix
    # matrix-org/matrix-rust-sdk#6670). Chain: matrix-sdk-crypto 0.18.0 ←
    # matrix-sdk-base 0.18.0 ← matrix-sdk 0.18.0 ← rantaiclaw, so it is only
    # reachable through the opt-in `channel-matrix` feature;
    # `cargo tree -i matrix-sdk-crypto` matches no package with default
    # features, so no default or released build contains it. The impact is a
    # panic (availability), triggered when sending custom to-device messages.
    # Nothing under `src/` calls `Device::encrypt_event_raw`,
    # `OlmMachine::encrypt_content_for_devices` or `IdentityBasedStrategy`, and
    # nothing sends a to-device message. The upgrade is blocked:
    # matrix-sdk-sqlite 0.19 needs `rusqlite ^0.40`, while `Cargo.toml` pins
    # `rusqlite = "0.37"` with `bundled`, and both link the native `sqlite3`
    # library, so the two cannot resolve together. Moving rusqlite to 0.40 also
    # pulls a RustCrypto chain (`rsa`, `pkcs8`, `russh`) that does not compile
    # today.
    #
    # REVIEW BY 2026-11-15 with the other matrix-sdk-family entries above.
    "RUSTSEC-2026-0318",
    # anymap2 v0.13.0 — RUSTSEC-2026-0319, flagged unmaintained, not a
    # vulnerability; there is no patched version, and the recommended
    # replacement is `anymap3`. Chain: anymap2 0.13.0 ← matrix-sdk 0.18.0 ←
    # rantaiclaw, so it is only reachable through the opt-in `channel-matrix`
    # feature; `cargo tree -i anymap2` matches no package with default
    # features, so no default or released build contains it. An unmaintained
    # type-map crate has no known flaw to trigger, and switching to `anymap3`
    # is matrix-sdk's choice, not ours. Dropping it needs a newer matrix-sdk,
    # which is blocked for the reason given in the RUSTSEC-2026-0318 entry
    # above (matrix-sdk 0.19 needs `rusqlite ^0.40`).
    #
    # REVIEW BY 2026-11-15 with the other matrix-sdk-family entries above.
    "RUSTSEC-2026-0319",
    # ttf-parser v0.25 via lopdf 0.42 → pdf-extract (KB PDF text extraction) —
    # font parser flagged unmaintained; parse-only path over operator-supplied
    # documents, no fixed release (lopdf 0.42 is current). Revisit on a lopdf bump.
    "RUSTSEC-2026-0192",
    # zip 8.6.0 — RUSTSEC-2026-0367, RUSTSEC-2026-0368 and RUSTSEC-2026-0369
    # (three 2026-10 advisories, patched only in >= 9.0.0). All three concern
    # `ZipArchive::extract()` / `ZipStreamReader::extract()`, which unpack
    # archive entries to disk; nothing in `src/` calls into the zip crate
    # directly, and the only reach is `kb-office`'s calamine 0.36.1 and
    # docx-rs 0.4.22, which both read entries into memory (calamine never
    # calls `extract`; docx-rs reads through `ZipArchive<Cursor<&[u8]>>`).
    # No default build contains zip at all. No in-range zip release exists to
    # move to: every 7.x/8.x was yanked (see the yanked entry above) and both
    # dependers still pin ^8.6.
    #
    # REVIEW BY 2026-11-15: drop these three ids once calamine and docx-rs
    # accept zip 9 and the lockfile picks it up.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    # webpki-roots v0.26.11 — RUSTSEC-2026-0381, emSign root removed from the
    # bundled root list. The advisory matches 0.26.11 by version number only:
    # 0.26.x is a wrapper that depends on `webpki-roots` 1.x, the crate that
    # actually ships the root list, and that dependency is held at >= 1.0.10 by
    # the Cargo.toml floor and locked at 1.0.10 in Cargo.lock — so the root list
    # every build actually embeds is the patched one with no emSign root. There
    # is no patched 0.26.x release; the wrapper stays because tokio-tungstenite
    # still requests ^0.26.
    #
    # REVIEW BY: drop this waiver when tokio-tungstenite or axum moves to
    # webpki-roots 1.x (checked 2026-10-20: tokio-tungstenite 0.30.0 still
    # requests ^0.26), and remove the 0.26.11 entry from Cargo.lock with it.
    "RUSTSEC-2026-0381",
]

[licenses]
# All licenses are denied unless explicitly allowed
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "0BSD",
    "BSL-1.0",
    # CC0-1.0 (Creative Commons Zero) is a public-domain dedication, FSF
    # Free/Libre, more permissive than MIT (no attribution required).
    # Used by `notify` 8.x (hot-reload watcher).
    "CC0-1.0",
]
unused-allowed-license = "allow"

# RantaiClaw itself is AGPL-3.0-only (see LICENSE). It is scoped as a per-crate
# exception rather than added to `allow` above, because `allow` governs what we
# accept from *dependencies* — a copyleft entry there would let an AGPL crate
# enter the tree unnoticed and bind downstream consumers.
[[licenses.exceptions]]
name = "rantaiclaw"
allow = ["AGPL-3.0-only"]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
