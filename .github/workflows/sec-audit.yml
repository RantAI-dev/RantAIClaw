name: Sec Audit

on:
    push:
        branches: [main]
        paths:
            - "Cargo.toml"
            - "Cargo.lock"
            - "src/**"
            - "crates/**"
            - "deny.toml"
    # Unfiltered on purpose: a `paths:` filter reports nothing on a
    # non-matching run, and a required check that never reports blocks the pull
    # request forever. The cost is ~3.5 minutes on a docs-only PR, in parallel
    # with jobs that take longer; the `push` trigger below keeps its filter
    # because a push that changes no dependency has nothing to audit and no
    # required check waiting on it.
    pull_request:
        branches: [main]
    schedule:
        - cron: "0 6 * * 1" # Weekly on Monday 6am UTC

concurrency:
    group: security-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    security-events: write
    actions: read
    checks: write
    # audit-check reports informational advisories (unmaintained/unsound) on
    # scheduled runs by opening an issue; without this the weekly cron fails
    # with "Resource not accessible by integration" even when the audit
    # itself finds zero vulnerabilities.
    issues: write

env:
    CARGO_TERM_COLOR: always

jobs:
    audit:
        name: Security Audit
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

            - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  # Mirrors deny.toml. russh SSH stack (opt-in remote-install tools):
                  # rsa Marvin sidechannel + russh/russh-cryptovec allocation advisories,
                  # no upstream fix for the 2026 set — revisit on a russh bump.
                  # quick-xml DoS advisories via docx-rs (opt-in kb-office DOCX
                  # ingestion; latest docx-rs still requires quick-xml ^0.36, no
                  # fixed upstream) — revisit on a docx-rs quick-xml >= 0.41 bump.
                  # imbl-sized-chunks 0.1.3 via matrix-sdk 0.18 (opt-in
                  # --features channel-matrix) — use-after-free / double-free in
                  # Chunk/InlineArray removal methods, trigger requires a
                  # panicking Drop impl. Upstream fix is imbl-sized-chunks
                  # >= 0.2.0 but matrix-sdk 0.18 pins imbl 6.1.0. Reviewed with
                  # the deny.toml entries; revisit on 2026-11-15 or when
                  # matrix-sdk ships an imbl bump.
                  ignore: RUSTSEC-2023-0071,RUSTSEC-2026-0153,RUSTSEC-2026-0154,RUSTSEC-2026-0159,RUSTSEC-2026-0194,RUSTSEC-2026-0195,RUSTSEC-2026-0292

    deny:
        name: License & Supply Chain
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

            - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
              with:
                  command: check advisories licenses sources
