name: Sec Audit

on:
    push:
        branches: [main]
        paths:
            - "Cargo.toml"
            - "Cargo.lock"
            - "src/**"
            - "crates/**"
            - "deny.toml"
    # Unfiltered on purpose: a `paths:` filter reports nothing on a
    # non-matching run, and a required check that never reports blocks the pull
    # request forever. The cost is ~3.5 minutes on a docs-only PR, in parallel
    # with jobs that take longer; the `push` trigger below keeps its filter
    # because a push that changes no dependency has nothing to audit and no
    # required check waiting on it.
    pull_request:
        branches: [main]
    schedule:
        - cron: "0 6 * * 1" # Weekly on Monday 6am UTC

concurrency:
    group: security-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    security-events: write
    actions: read
    checks: write
    # audit-check reports informational advisories (unmaintained/unsound) on
    # scheduled runs by opening an issue; without this the weekly cron fails
    # with "Resource not accessible by integration" even when the audit
    # itself finds zero vulnerabilities.
    issues: write

env:
    CARGO_TERM_COLOR: always

jobs:
    audit:
        name: Security Audit
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  # This list must stay identical to deny.toml's `ignore` array. Edit both
                  # together. deny.toml carries the justifications and review dates.
                  ignore: RUSTSEC-2023-0071,RUSTSEC-2024-0388,RUSTSEC-2025-0141,RUSTSEC-2025-0167,RUSTSEC-2026-0173,RUSTSEC-2026-0192,RUSTSEC-2026-0194,RUSTSEC-2026-0195,RUSTSEC-2026-0247,RUSTSEC-2026-0292

    deny:
        name: License & Supply Chain
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
              with:
                  command: check advisories licenses sources
