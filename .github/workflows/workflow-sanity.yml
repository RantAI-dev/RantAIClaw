name: Workflow Sanity

# Deliberately unfiltered on `pull_request`. A `paths:` filter makes this
# workflow report *nothing* on a run that does not match, and a required status
# check that never reports leaves every pull request pending — so a filtered
# workflow can never be required. Both jobs together take well under a minute,
# which is cheaper than the class of mistake they catch.
#
# `push` stays scoped to `main`: a push to a feature branch is already covered
# by that branch's pull request, and running both produced two identical checks
# on every PR.
on:
    pull_request:
    push:
        branches: [main]
        paths:
            - ".github/workflows/**"
            - ".github/*.yml"
            - ".github/*.yaml"

concurrency:
    group: workflow-sanity-${{ github.event.pull_request.number || github.sha }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    no-tabs:
        name: Workflow Sanity (tabs)
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

            - name: Fail on tabs in workflow files
              shell: bash
              run: |
                  set -euo pipefail
                  python - <<'PY'
                  from __future__ import annotations

                  import pathlib
                  import sys

                  root = pathlib.Path(".github/workflows")
                  bad: list[str] = []
                  for path in sorted(root.rglob("*.yml")):
                    if b"\t" in path.read_bytes():
                      bad.append(str(path))
                  for path in sorted(root.rglob("*.yaml")):
                    if b"\t" in path.read_bytes():
                      bad.append(str(path))

                  if bad:
                    print("Tabs found in workflow file(s):")
                    for path in bad:
                      print(f"- {path}")
                    sys.exit(1)
                  PY

    actionlint:
        name: Workflow Sanity (actionlint)
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

            - name: Lint GitHub workflows
              uses: rhysd/actionlint@393031adb9afb225ee52ae2ccd7a5af5525e03e8 # v1.7.11

    # The release job that mints cosign signatures holds contents/packages/id-token/
    # attestations write. Whatever it executes runs beside those credentials, so the
    # rule is: everything a workflow runs is fixed by digest. A moving tag and a piped
    # remote script are the same hole — the code that runs is chosen after review.
    # Both halves are asserted here because pinning that nothing enforces drifts back
    # on the next pull request that adds a step.
    # A release tag that stops being reachable from `main` breaks bisect across
    # that release and makes `git describe` unable to name it — and when the tag
    # is what keeps a signed artefact's commit alive, it is a supply-chain
    # problem rather than a cosmetic one. `pub-release.yml` already refuses to
    # publish such a tag, but that guard runs at release time and cannot see a
    # rewrite performed afterwards. This one runs on every pull request.
    release-tags:
        name: Workflow Sanity (release tag ancestry)
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
              with:
                  # Tags and full history: the check is entirely about reachability.
                  fetch-depth: 0
                  fetch-tags: true

            - name: Self-test the exemption logic
              run: ./scripts/ci/check_release_tag_ancestry.sh --self-test

            - name: Every release tag is reachable from main
              run: ./scripts/ci/check_release_tag_ancestry.sh

    pinned-sources:
        name: Workflow Sanity (pinned sources)
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

            - name: Fail on unpinned actions or piped remote scripts
              shell: bash
              run: |
                  set -euo pipefail
                  python - <<'PY'
                  from __future__ import annotations

                  import pathlib
                  import re
                  import sys

                  USES = re.compile(r"^\s*(?:-\s*)?uses:\s*(\S+)")
                  PINNED = re.compile(r"^[^@]+@[0-9a-f]{40}$")
                  # curl/wget whose output is piped straight into an interpreter.
                  PIPED = re.compile(r"\b(?:curl|wget)\b[^|]*\|\s*(?:sudo\s+)?(?:ba|z|d)?sh\b")

                  root = pathlib.Path(".github/workflows")
                  bad: list[str] = []
                  for path in sorted([*root.rglob("*.yml"), *root.rglob("*.yaml")]):
                    for lineno, line in enumerate(path.read_text().splitlines(), 1):
                      match = USES.match(line)
                      if match:
                        ref = match.group(1)
                        # Local composite actions and docker:// refs carry no tag to move.
                        if not ref.startswith(("./", "docker://")) and not PINNED.match(ref):
                          bad.append(f"{path}:{lineno}: unpinned action `{ref}` (use a 40-char commit SHA)")
                      if PIPED.search(line):
                        bad.append(f"{path}:{lineno}: remote script piped into a shell")

                  if bad:
                    print("Unpinned sources found:")
                    for entry in bad:
                      print(f"- {entry}")
                    sys.exit(1)
                  print("All action uses are SHA-pinned and no workflow pipes a remote script.")
                  PY
