name: CI Run

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ci-${{ github.event.pull_request.number || github.sha }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    CARGO_TERM_COLOR: always
    # `line-tables-only` keeps line numbers, so a panic backtrace still
    # points at a source line, and drops the type and variable information
    # that makes the linked test binaries large. The `test` profile inherits
    # `debug` from `dev` in cargo, so this one variable covers both. The
    # `build` job is unaffected: it builds `--profile release-fast`, which
    # inherits `release`, not `dev`.
    #
    # This invalidates every rust-cache key once: the action hashes every
    # environment variable whose name starts with `CARGO` into its key, so
    # every cache in this workflow is cold on the first run after this lands
    # and warm from then on.
    CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
    changes:
        name: Detect Change Scope
        runs-on: ubuntu-latest
        outputs:
            docs_only: ${{ steps.scope.outputs.docs_only }}
            docs_changed: ${{ steps.scope.outputs.docs_changed }}
            rust_changed: ${{ steps.scope.outputs.rust_changed }}
            channel_features_changed: ${{ steps.scope.outputs.channel_features_changed }}
            docs_files: ${{ steps.scope.outputs.docs_files }}
            base_sha: ${{ steps.scope.outputs.base_sha }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            # Bash + git only, takes seconds. Runs first so a regression in
            # the script never silently turns the rest of the job green.
            - name: Self-test change scope detection
              shell: bash
              run: bash ./scripts/ci/tests/test_detect_change_scope.sh

            # Same shape as the self-test above: the wrapper script under
            # test is used by every filtered lib-test step in this file and
            # in pub-release.yml. A regression in the script silently
            # turns a broken filter into a passing gate; the self-test
            # fails instead.
            - name: Self-test the filtered-lib-test gate
              shell: bash
              run: bash ./scripts/ci/tests/test_run_filtered_lib_tests.sh

            # Same shape as the self-tests above: the installer's pre-built
            # binary path is the one step that runs before anything lands on
            # disk, so a release archive that fails verification has to stop
            # the install there instead of falling back to a source build. The
            # self-test drives that path over a file:// release fixture — no
            # network, no Rust toolchain — so a regression fails the job
            # instead of silently weakening the installer.
            - name: Self-test the pre-built binary tamper handling
              shell: bash
              run: bash ./scripts/ci/tests/test_bootstrap_prebuilt_tamper.sh

            # Same shape as the self-tests above: the lint job reads one
            # shared clippy JSON file in two gates, and a gate that stops
            # reading it fails open instead of failing the job. The self-test
            # drives both gates over JSON fixtures — no Rust toolchain — so a
            # regression fails the job instead of weakening the lint gate.
            - name: Self-test the shared clippy JSON gates
              shell: bash
              run: bash ./scripts/ci/tests/test_clippy_json_gates.sh

            # Same shape as the self-tests above: the cache policy and the
            # profile overrides are the parts of this workflow nobody reads
            # once they are written. A rust-cache that saves on a pull
            # request fills the 10 GB Actions cache quota and evicts the
            # `main` entries that matter, and a bench job that inherits the
            # release profile's fat LTO pays for a compile-only check — both
            # regressions are silent, and the CI result stays green. The
            # self-test reads the workflow as it is and fails this job
            # instead.
            #
            # A red step here fails this job, and `CI Required Gate` reads
            # this job's result (`CHANGES_RESULT`) before it looks at the
            # scope outputs, so a self-test that fails blocks the pull
            # request that introduces the regression.
            - name: Self-test the CI cache and profile policy
              shell: bash
              run: bash ./scripts/ci/tests/test_ci_cache_and_profile_policy.sh

            - name: Detect docs-only changes
              id: scope
              shell: bash
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
              run: ./scripts/ci/detect_change_scope.sh

    identity:
        # CLAUDE.md §9.1 is a merge gate, and identity strings can land in any
        # file type — a fixture, a doc, a commit-message example. So this runs
        # unconditionally: no `needs`, no scope `if`, no `ci:full` label. The
        # script was added by #502 and then wired into no workflow at all, so
        # the gate existed on disk and enforced nothing.
        #
        # Cheap by construction: a grep over tracked files, no toolchain, no
        # build, no cache.
        name: Identity Strings (CLAUDE.md 9.1)
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: No personal identity data
              run: ./scripts/ci/check_identity_strings.sh --self-test

    # The format check gets its own job so a formatting mistake is reported
    # in seconds instead of behind the whole lint job. `rustfmt` compiles
    # nothing, so this job needs no cargo cache — it is the cheapest Rust
    # stage there is, and the heavy jobs wait for it rather than for clippy.
    #
    # The toolchain is the same 1.92.0 pin every other Rust job uses, so the
    # rustfmt that runs here is the rustfmt the lint job used to run.
    fmt:
        name: Format (rustfmt)
        needs: [changes]
        if: needs.changes.outputs.rust_changed == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
              with:
                  toolchain: 1.92.0
                  components: rustfmt
            - name: Check formatting
              run: cargo fmt --all -- --check

    lint:
        name: Lint Gate (Clippy + Strict Delta)
        needs: [changes]
        if: needs.changes.outputs.rust_changed == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
            - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
              with:
                  toolchain: 1.92.0
                  components: rustfmt, clippy
            # The cache is restored on every run and written only on a push
            # to `main`. A cache that every pull request writes into is what
            # fills the 10 GB Actions cache quota and evicts the `main`
            # entries that matter; a pull request keeps its cache hits, it
            # just stops creating new ones.
            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
              with:
                  save-if: ${{ github.ref == 'refs/heads/main' }}
            # One clippy run for both lint gates. The quality gate and the
            # strict delta gate used to lint the crate separately, and the
            # second run re-checked every target for findings the first one
            # had already produced. This run keeps the JSON; the gates below
            # decide what blocks.
            - name: Run clippy once (shared by both gates)
              id: clippy
              shell: bash
              run: ./scripts/ci/run_clippy_json.sh "$RUNNER_TEMP/clippy.json" >> "$GITHUB_OUTPUT"
            # `--skip-fmt`: the format check runs in the `fmt` job above, so
            # running it here as well would check every file twice. The
            # script still formats when it is called without that flag — it
            # is the complete local gate used by `dev/ci.sh` and
            # `.githooks/pre-push`.
            - name: Run rust quality gate
              env:
                  CLIPPY_JSON_FILE: ${{ steps.clippy.outputs.path }}
                  CLIPPY_EXIT_CODE: ${{ steps.clippy.outputs.exit_code }}
              run: ./scripts/ci/rust_quality_gate.sh --skip-fmt
            - name: Run strict lint delta gate
              env:
                  BASE_SHA: ${{ needs.changes.outputs.base_sha }}
                  CLIPPY_JSON_FILE: ${{ steps.clippy.outputs.path }}
                  CLIPPY_EXIT_CODE: ${{ steps.clippy.outputs.exit_code }}
              run: ./scripts/ci/rust_strict_delta_gate.sh
            # Source-level guards. Cheap greps, no build — they belong here rather
            # than in `features`, which is label-gated and would not run on the PRs
            # that introduce these regressions.
            - name: Provisioner probe hosts match their channel modules
              run: ./scripts/ci/check_provisioner_probe_hosts.sh
            - name: Channel config fields have runtime readers
              run: ./scripts/ci/check_channel_config_readers.sh
            # Blocking, and deliberately run on BOTH sides: a tier is changed in
            # src/ and rendered in docs/, so either edit alone leaves a surface
            # stale. The docs-side copy is in `docs-quality` below.
            - name: Channel maturity surfaces match the catalog
              run: ./scripts/ci/check_channel_maturity.sh
            # ADVISORY (continue-on-error) — plan 261. Broader coverage that is
            # not yet reliable enough to block: the whole-schema reader check has
            # grep limits (destructured/by-value reads, shared field names) and
            # the command-coverage check still has a documented backlog (J5/J6).
            # Flip to blocking (remove continue-on-error) once the AST-based
            # reader pass lands and the command reference is complete.
            - name: Every CLI command is documented
              run: ./scripts/ci/docs_command_coverage.sh
            - name: Every HTTP route is documented
              run: ./scripts/ci/docs_api_route_coverage.sh
            - name: All config fields have runtime readers (advisory)
              continue-on-error: true
              run: ./scripts/ci/check_config_readers.sh

    test:
        name: Test
        needs: [changes, fmt]
        if: needs.changes.outputs.rust_changed == 'true' && needs.fmt.result == 'success'
        runs-on: ubuntu-latest
        # 45min: cargo test on the full workspace runs ~6,300 tests over
        # 32 binaries. Empirically takes 9–12 min when the cache is warm,
        # but the cold cache + cross-binary recompile in the May-2026
        # runner image has pushed total Test-step time past 25 min on
        # back-to-back runs. 45 min leaves headroom for transient
        # runner-image slowness without masking a true deadlock.
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
              with:
                  toolchain: 1.92.0
            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
              with:
                  save-if: ${{ github.ref == 'refs/heads/main' }}
            - name: Free up runner disk space
              # `cargo test --locked --workspace` links ~32 debug test binaries,
              # each carrying the full rantaiclaw lib + heavy deps (matrix-sdk,
              # russh, aws-lc, …). Their combined `target/` has intermittently
              # exhausted the ubuntu-latest disk ("No space left on device",
              # plus an ld SIGBUS on a full disk), failing the Test job on some
              # main pushes. Reclaim the preinstalled toolchains we don't use
              # (~25 GB) so the build has ample headroom.
              run: |
                  df -h /
                  sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
                  sudo docker image prune --all --force || true
                  df -h /
            - name: Run tests
              # `cargo nextest` was tried first but the runner consistently
              # SIGTERM'd or hit the 30-min cap on this codebase. `cargo
              # test --locked` is the known-good invocation from prior to
              # the v0.6.40-alpha CI overhaul and is what the v0.6.40-alpha
              # release was actually verified against.
              #
              # `--test-threads=1`: many unit tests mutate process-global env
              # (HOME, RANTAICLAW_CONFIG_DIR) behind per-file locks that don't
              # serialize across modules, so the parallel run failed ~10 tests
              # on every main push (store_minted_*_code_claims_owner,
              # shell_preserves_path_and_home). The lib suite's parallel wall
              # time was ~5s, so running serially costs well under the job cap.
              # Cross-module env-lock hygiene is the follow-up that lifts this.
              run: cargo test --locked --workspace -- --test-threads=1

            # The free-disk step above prints `df -h /` before and after it
            # reclaims the preinstalled toolchains; this one prints the disk
            # the test binaries actually left behind. One run's numbers are
            # not proof that the reclaim step can go, so that step stays —
            # the measurement is what a later change has to argue from.
            - name: Report disk usage after the tests
              if: always()
              run: df -h /

    # `Cargo.toml` declares `rust-version`, and until this job existed nothing
    # built at it: every other Rust job pins 1.92.0, the `channel-features`
    # job 1.96.0 and the Dockerfile `rust:1.98-slim`. A declared MSRV that no
    # build exercises is a claim, and this repository treats claims as things
    # that get checked.
    #
    # The toolchain is read out of `Cargo.toml` rather than pinned here on
    # purpose. Pinning it would mean the job tests a number that can silently
    # drift from the declaration it is supposed to defend — raising
    # `rust-version` would leave this job still proving the old one. Reading it
    # makes the manifest the single source, so whatever it declares is what CI
    # compiles.
    msrv:
        name: MSRV (declared rust-version)
        needs: [changes, fmt]
        if: needs.changes.outputs.rust_changed == 'true' && needs.fmt.result == 'success'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Read the declared MSRV
              id: declared
              shell: bash
              run: |
                  set -euo pipefail
                  line="$(grep -m1 -E '^rust-version[[:space:]]*=' Cargo.toml || true)"
                  version="$(printf '%s' "$line" | sed -E 's/.*"([^"]+)".*/\1/')"
                  if [[ ! "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
                    echo "::error file=Cargo.toml::could not parse rust-version (read '${version}')"
                    exit 1
                  fi
                  echo "Declared MSRV: ${version}"
                  echo "version=${version}" >> "$GITHUB_OUTPUT"

            - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
              with:
                  toolchain: ${{ steps.declared.outputs.version }}

            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
              with:
                  key: msrv-${{ steps.declared.outputs.version }}
                  save-if: ${{ github.ref == 'refs/heads/main' }}

            # `--all-targets`, not `--lib`: the binary crate root recompiles the
            # library as a second crate, and tests and benches use APIs the lib
            # alone never reaches. "Builds at the MSRV" is only true if every
            # target does.
            - name: Check every target at the declared MSRV
              run: cargo check --locked --all-targets

    # The two channel features get one job rather than a row in the
    # `features` job below, because that job only runs `cargo check`, which
    # would not have caught the defects in `src/channels/lark.rs` — 1,774
    # lines including a hand-rolled websocket codec and an axum server that
    # no CI job compiled until a job existed for it.
    #
    # Matrix gets the same treatment for a sharper reason: until the pin
    # moved to matrix-sdk 0.18 this channel could not be compiled at all
    # (0.16 overflowed the rustc type-check recursion budget), so its
    # 1,194 lines and 31 tests were checked by nothing and its test module
    # carried a type error that had never been seen. A channel with no CI
    # job is exactly how that rotted unnoticed.
    #
    # Not `paths:`-filtered on purpose. A filtered job reports nothing on PRs
    # that miss the filter, and a required check that never reports leaves the
    # PR pending forever (#699). It runs on the same `rust_changed` condition as
    # every other Rust job; the rust-cache keyed `channel-features` keeps the
    # matrix-sdk tree warm so only the first run pays for its ~67 extra crates.
    #
    # Only the two filtered test steps are skipped — not the job and not the
    # compile check — when the change scope says no channel-feature file
    # changed. The job still reports `success` then, and that is the only
    # shape the merge gate accepts for it. Each step carries `!cancelled()`
    # so a failing step does not stop the next one, because the two channels
    # were independent jobs before the merge and one failure must not hide
    # the other's result.
    channel-features:
        name: Channel Features (Lark + Matrix)
        needs: [changes, fmt]
        if: needs.changes.outputs.rust_changed == 'true' && needs.fmt.result == 'success'
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            # 1.96, not the 1.92.0 every other job pins: matrix-sdk 0.19 declares
            # `rust-version = "1.96"`, so this feature builds only on 1.96 or newer.
            # The crate's own MSRV for default features stays 1.91. Confined to this
            # job on purpose: moving the repo off 1.92.0 would touch every other
            # workflow pin, the release build and the crate's declared MSRV (1.91),
            # which is a product decision and not a side effect of a channel fix.
            #
            # Nothing else is affected: `channel-matrix` is not a default feature, and
            # an unactivated optional dependency does not impose its rust-version on
            # the build.
            - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
              with:
                  toolchain: 1.96.0
            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
              with:
                  key: channel-features
                  save-if: ${{ github.ref == 'refs/heads/main' }}
            # `--lib` alone is not enough to claim the feature builds. Turning it
            # on pulls `decancer`, whose `impl Add<Translation> for String` makes
            # `String + &String` ambiguous — which broke two integration tests
            # (`tests/kb/chunk_test.rs`) that no `--lib` run touches. Checking
            # every target is what makes "builds with channel-matrix" true.
            #
            # No `channel_features_changed` condition, on purpose: `channel-matrix`
            # is not a default feature, so this is the only compile of
            # `src/channels/matrix.rs`, and that file depends on others the scope
            # rule does not cover (`src/channels/traits.rs`, `src/channels/pairing.rs`,
            # `src/security/pairing_store`, `tests/`). Skipping the check on a PR
            # that touches only those would merge green and turn `main` red.
            # It runs first so its result is the first one in the log; the test
            # steps still run after it fails, because each carries `!cancelled()`.
            - name: Check every target under channel-matrix
              if: ${{ !cancelled() }}
              run: cargo check --locked --features channel-lark,channel-matrix --all-targets
            # Both features are enabled for both filtered test runs: the point
            # of the job is that the two channels compile together, which is
            # the only combination a user can build.
            - name: Build and test channel-lark
              if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.channel_features_changed == 'true') }}
              run: bash scripts/ci/run_filtered_lib_tests.sh test --locked --features channel-lark,channel-matrix --lib channels::lark
            - name: Build and test channel-matrix
              if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.channel_features_changed == 'true') }}
              run: bash scripts/ci/run_filtered_lib_tests.sh test --locked --features channel-lark,channel-matrix --lib channels::matrix

    features:
        name: Features (no-default, otel, kb-office)
        needs: [changes, fmt]
        # Was label-gated behind `ci:full`, which meant a feature combination
        # only broke after merge. The no-default-features check takes ~60-80s.
        # The checks that add one feature to the default set take about 2
        # minutes with a warm cache, and longer on the first cold run. They
        # run in sequence in one job now, so they share one cache and one
        # runner instead of three.
        if: needs.changes.outputs.rust_changed == 'true' && needs.fmt.result == 'success'
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
              with:
                  toolchain: 1.92.0
            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
              with:
                  key: features
                  save-if: ${{ github.ref == 'refs/heads/main' }}
            # `all-features` is still omitted, but no longer because of
            # matrix-sdk: 0.18 type-checks at the default limit, and
            # `channel-features` has its own job above. What `all-features`
            # would additionally pull is the remaining opt-in set —
            # `legacy-providers`, `rag-pdf`, `kb-ocr` — which is a
            # separate cost question from this one. Re-adding it is a
            # follow-up, not a side effect of the matrix pin bump.
            #
            # `--all-targets` on the two feature checks that have tests,
            # benches or examples of their own: the library compiles fine
            # under `--features <f>` but the targets built only with
            # `--all-targets` (tests, benches, examples) are what these
            # checks need to defend. The `no-default-features` check has no
            # feature to verify with tests/benches/examples specific to that
            # configuration, so it stays as is.
            #
            # `if: !cancelled()` on every step: these three used to be a
            # matrix with `fail-fast: false`, so one failing combination did
            # not hide the other two. The steps keep that property — a failing
            # step does not stop the next one — and the job still fails if any
            # step fails.
            - name: Check no-default-features
              if: ${{ !cancelled() }}
              run: cargo check --locked --no-default-features
            - name: Check observability-otel
              if: ${{ !cancelled() }}
              run: cargo check --locked --features observability-otel --all-targets
            - name: Check kb-office
              if: ${{ !cancelled() }}
              run: cargo check --locked --features kb-office --all-targets

    # The E2E job is gone: `tests/agent_e2e.rs` is an auto-discovered
    # integration target of the root package, so the `test` job's
    # `cargo test --locked --workspace` already runs it. The separate job
    # only re-ran the same tests.

    bench-compile:
        name: Bench Compile
        needs: [changes, fmt]
        # The one stage that does cost something: ~11 minutes, which makes it
        # the critical path on a Rust PR (previously `build`, ~8). Paid because
        # benches live outside `--lib`/`--bin`, so nothing else notices when a
        # signature change stops them compiling — and `main` went red for it.
        if: needs.changes.outputs.rust_changed == 'true' && needs.fmt.result == 'success'
        runs-on: ubuntu-latest
        timeout-minutes: 25
        # `Cargo.toml` declares no `[profile.bench]`, so the bench profile
        # inherits `[profile.release]`: opt-level "z", fat LTO, one codegen
        # unit. Those are the right settings for a shipped binary and the
        # wrong ones for a job that only has to prove the bench targets
        # compile and link — the fat LTO is most of this job's runtime.
        # `cargo bench --no-run` never runs a benchmark, so an unoptimized
        # build changes nothing the job measures.
        #
        # Job env only: `Cargo.toml` is untouched, so the release profile and
        # every release build keep their settings.
        env:
            CARGO_PROFILE_BENCH_LTO: "false"
            CARGO_PROFILE_BENCH_OPT_LEVEL: "0"
            CARGO_PROFILE_BENCH_CODEGEN_UNITS: "16"
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
              with:
                  toolchain: 1.92.0
            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
              with:
                  save-if: ${{ github.ref == 'refs/heads/main' }}
            - name: Verify benchmarks compile
              run: cargo bench --no-run --locked

    build:
        name: Build (Smoke)
        needs: [changes, fmt]
        if: needs.changes.outputs.rust_changed == 'true' && needs.fmt.result == 'success'
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
              with:
                  toolchain: 1.92.0
            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
              with:
                  save-if: ${{ github.ref == 'refs/heads/main' }}
            - name: Build binary (smoke check)
              run: cargo build --profile release-fast --locked --verbose
            - name: Check binary size
              run: ./scripts/ci/check_binary_size.sh target/release-fast/rantaiclaw

    docs-only:
        name: Docs-Only Fast Path
        needs: [changes]
        if: needs.changes.outputs.docs_only == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Skip heavy jobs for docs-only change
              run: echo "Docs-only change detected. Rust lint/test/build skipped."

    non-rust:
        name: Non-Rust Fast Path
        needs: [changes]
        if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.rust_changed != 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Skip Rust jobs for non-Rust change scope
              run: echo "No Rust-impacting files changed. Rust lint/test/build skipped."

    docs-quality:
        name: Docs Quality
        needs: [changes]
        # Not label-gated: the required gate refuses a docs change whose lint did
        # not pass, on pull requests as well as pushes, so this has to have run.
        if: needs.changes.outputs.docs_changed == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Markdown lint (changed lines only)
              env:
                  BASE_SHA: ${{ needs.changes.outputs.base_sha }}
                  DOCS_FILES: ${{ needs.changes.outputs.docs_files }}
              run: ./scripts/ci/docs_quality_gate.sh

            # ADVISORY (continue-on-error) — plan 261. Also runs on the code side
            # (Lint Gate) so a command added in src/ is caught; here it catches a
            # command dropped from the reference by a docs edit. Flip to blocking
            # once the command reference is complete (J5/J6).
            - name: Every CLI command is documented
              run: ./scripts/ci/docs_command_coverage.sh
            - name: Every HTTP route is documented
              run: ./scripts/ci/docs_api_route_coverage.sh

            # Blocking. Catches the docs half: a maturity table row edited to
            # disagree with CHANNEL_CATALOG touches no Rust file, so the Lint
            # Gate copy of this check never runs for it.
            - name: Channel maturity surfaces match the catalog
              run: ./scripts/ci/check_channel_maturity.sh

            - name: Collect added links
              id: collect_links
              shell: bash
              env:
                  BASE_SHA: ${{ needs.changes.outputs.base_sha }}
                  DOCS_FILES: ${{ needs.changes.outputs.docs_files }}
              run: |
                  set -euo pipefail
                  python3 ./scripts/ci/collect_changed_links.py \
                    --base "$BASE_SHA" \
                    --docs-files "$DOCS_FILES" \
                    --output .ci-added-links.txt
                  count=$(wc -l < .ci-added-links.txt | tr -d ' ')
                  echo "count=$count" >> "$GITHUB_OUTPUT"
                  if [ "$count" -gt 0 ]; then
                    echo "Added links queued for check:"
                    cat .ci-added-links.txt
                  else
                    echo "No added links found in changed docs lines."
                  fi

            - name: Link check (offline, added links only)
              if: steps.collect_links.outputs.count != '0'
              uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
              with:
                  fail: true
                  args: >-
                      --offline
                      --no-progress
                      --format detailed
                      .ci-added-links.txt
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Skip link check (no added links)
              if: steps.collect_links.outputs.count == '0'
              run: echo "No added links in changed docs lines. Link check skipped."

    lint-feedback:
        name: Lint Feedback
        if: github.event_name == 'pull_request'
        needs: [changes, lint, docs-quality]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
            issues: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Post actionable lint failure summary
              if: always()
              uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
              env:
                  RUST_CHANGED: ${{ needs.changes.outputs.rust_changed }}
                  DOCS_CHANGED: ${{ needs.changes.outputs.docs_changed }}
                  LINT_RESULT: ${{ needs.lint.result }}
                  LINT_DELTA_RESULT: ${{ needs.lint.result }}
                  DOCS_RESULT: ${{ needs.docs-quality.result }}
              with:
                  script: |
                      const script = require('./.github/workflows/scripts/lint_feedback.js');
                      await script({github, context, core});

    ci-required:
        name: CI Required Gate
        if: always()
        needs:
            [
                changes,
                identity,
                fmt,
                lint,
                test,
                msrv,
                channel-features,
                features,
                bench-compile,
                build,
                docs-only,
                non-rust,
                docs-quality,
                lint-feedback,
            ]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            # The decision table this job enforces, checked before it is used.
            # The gate used to be inlined here, which is how it came to run two
            # jobs it never read. The self-test also checks that the workflow
            # and the gate agree, so a job that is added here without being
            # read by the gate fails the job instead of turning advisory.
            - name: Self-test the gate
              run: ./scripts/ci/required_gate.sh --self-test

            - name: Enforce required status
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  RUST_CHANGED: ${{ needs.changes.outputs.rust_changed }}
                  DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
                  DOCS_CHANGED: ${{ needs.changes.outputs.docs_changed }}
                  CHANNEL_FEATURES_CHANGED: ${{ needs.changes.outputs.channel_features_changed }}
                  CHANGES_RESULT: ${{ needs.changes.result }}
                  IDENTITY_RESULT: ${{ needs.identity.result }}
                  FMT_RESULT: ${{ needs.fmt.result }}
                  LINT_RESULT: ${{ needs.lint.result }}
                  TEST_RESULT: ${{ needs.test.result }}
                  MSRV_RESULT: ${{ needs.msrv.result }}
                  CHANNEL_FEATURES_RESULT: ${{ needs.channel-features.result }}
                  FEATURES_RESULT: ${{ needs.features.result }}
                  BENCH_COMPILE_RESULT: ${{ needs.bench-compile.result }}
                  BUILD_RESULT: ${{ needs.build.result }}
                  DOCS_RESULT: ${{ needs.docs-quality.result }}
              run: ./scripts/ci/required_gate.sh
