name: CI Run

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ci-${{ github.event.pull_request.number || github.sha }}
    cancel-in-progress: true

permissions:
    contents: read

env:
    CARGO_TERM_COLOR: always

jobs:
    changes:
        name: Detect Change Scope
        runs-on: ubuntu-latest
        outputs:
            docs_only: ${{ steps.scope.outputs.docs_only }}
            docs_changed: ${{ steps.scope.outputs.docs_changed }}
            rust_changed: ${{ steps.scope.outputs.rust_changed }}
            docs_files: ${{ steps.scope.outputs.docs_files }}
            base_sha: ${{ steps.scope.outputs.base_sha }}
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
              with:
                  fetch-depth: 0

            - name: Detect docs-only changes
              id: scope
              shell: bash
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
              run: ./scripts/ci/detect_change_scope.sh

    identity:
        # CLAUDE.md §9.1 is a merge gate, and identity strings can land in any
        # file type — a fixture, a doc, a commit-message example. So this runs
        # unconditionally: no `needs`, no scope `if`, no `ci:full` label. The
        # script was added by #502 and then wired into no workflow at all, so
        # the gate existed on disk and enforced nothing.
        #
        # Cheap by construction: a grep over tracked files, no toolchain, no
        # build, no cache.
        name: Identity Strings (CLAUDE.md 9.1)
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
            - name: No personal identity data
              run: ./scripts/ci/check_identity_strings.sh --self-test

    lint:
        name: Lint Gate (Format + Clippy + Strict Delta)
        needs: [changes]
        if: needs.changes.outputs.rust_changed == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
              with:
                  fetch-depth: 0
            - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
              with:
                  toolchain: 1.92.0
                  components: rustfmt, clippy
            - uses: Swatinem/rust-cache@v2
            - name: Run rust quality gate
              run: ./scripts/ci/rust_quality_gate.sh
            - name: Run strict lint delta gate
              env:
                  BASE_SHA: ${{ needs.changes.outputs.base_sha }}
              run: ./scripts/ci/rust_strict_delta_gate.sh
            # Source-level guards. Cheap greps, no build — they belong here rather
            # than in `features`, which is label-gated and would not run on the PRs
            # that introduce these regressions.
            - name: Provisioner probe hosts match their channel modules
              run: ./scripts/ci/check_provisioner_probe_hosts.sh
            - name: Channel config fields have runtime readers
              run: ./scripts/ci/check_channel_config_readers.sh
            # ADVISORY (continue-on-error) — plan 261. Broader coverage that is
            # not yet reliable enough to block: the whole-schema reader check has
            # grep limits (destructured/by-value reads, shared field names) and
            # the command-coverage check still has a documented backlog (J5/J6).
            # Flip to blocking (remove continue-on-error) once the AST-based
            # reader pass lands and the command reference is complete.
            - name: Every CLI command is documented (advisory)
              continue-on-error: true
              run: ./scripts/ci/docs_command_coverage.sh
            - name: All config fields have runtime readers (advisory)
              continue-on-error: true
              run: ./scripts/ci/check_config_readers.sh

    test:
        name: Test
        needs: [changes, lint]
        if: needs.changes.outputs.rust_changed == 'true' && needs.lint.result == 'success'
        runs-on: ubuntu-latest
        # 45min: cargo test on the full workspace runs ~6,300 tests over
        # 32 binaries. Empirically takes 9–12 min when the cache is warm,
        # but the cold cache + cross-binary recompile in the May-2026
        # runner image has pushed total Test-step time past 25 min on
        # back-to-back runs. 45 min leaves headroom for transient
        # runner-image slowness without masking a true deadlock.
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
            - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
              with:
                  toolchain: 1.92.0
            - uses: Swatinem/rust-cache@v2
            - name: Free up runner disk space
              # `cargo test --locked --workspace` links ~32 debug test binaries,
              # each carrying the full rantaiclaw lib + heavy deps (matrix-sdk,
              # russh, aws-lc, …). Their combined `target/` has intermittently
              # exhausted the ubuntu-latest disk ("No space left on device",
              # plus an ld SIGBUS on a full disk), failing the Test job on some
              # main pushes. Reclaim the preinstalled toolchains we don't use
              # (~25 GB) so the build has ample headroom.
              run: |
                  df -h /
                  sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
                  sudo docker image prune --all --force || true
                  df -h /
            - name: Run tests
              # `cargo nextest` was tried first but the runner consistently
              # SIGTERM'd or hit the 30-min cap on this codebase. `cargo
              # test --locked` is the known-good invocation from prior to
              # the v0.6.40-alpha CI overhaul and is what the v0.6.40-alpha
              # release was actually verified against.
              #
              # `--test-threads=1`: many unit tests mutate process-global env
              # (HOME, RANTAICLAW_CONFIG_DIR) behind per-file locks that don't
              # serialize across modules, so the parallel run failed ~10 tests
              # on every main push (store_minted_*_code_claims_owner,
              # shell_preserves_path_and_home). The lib suite's parallel wall
              # time was ~5s, so running serially costs well under the job cap.
              # Cross-module env-lock hygiene is the follow-up that lifts this.
              run: cargo test --locked --workspace -- --test-threads=1

    # `channel-lark` gets its own job rather than a row in the `features` matrix
    # below because that matrix only runs `cargo check`, which would not have
    # caught the defects in `src/channels/lark.rs` — 1,774 lines including a
    # hand-rolled websocket codec and an axum server that no CI job compiled
    # until this job existed. (It also used to be the only one of the two that
    # ran on a PR at all; the matrix is no longer label-gated.)
    #
    # Unlike `channel-matrix`, this feature has no upstream blocker: it pulls only
    # `prost`. Verified building clean at f189422 in ~3m.
    channel-lark:
        name: Channel Lark (build + test)
        needs: [changes, lint]
        if: needs.changes.outputs.rust_changed == 'true' && needs.lint.result == 'success'
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
            - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
              with:
                  toolchain: 1.92.0
            - uses: Swatinem/rust-cache@v2
              with:
                  key: channel-lark
            - name: Build and test channel-lark
              run: cargo test --locked --features channel-lark --lib channels::lark

    features:
        name: Features (${{ matrix.name }})
        needs: [changes, lint]
        # Was label-gated behind `ci:full`, which meant a feature combination
        # only broke after merge. Each variant takes ~60-80s and they run in
        # parallel, well inside the `build` job's ~8 minutes — so requiring
        # them costs no wall-clock.
        if: needs.changes.outputs.rust_changed == 'true' && needs.lint.result == 'success'
        runs-on: ubuntu-latest
        timeout-minutes: 25
        strategy:
            fail-fast: false
            matrix:
                # `all-features` is intentionally omitted: matrix-sdk-0.16
                # blows past the type-check recursion budget under
                # --all-features, and the fix has to land upstream (a
                # `#![recursion_limit]` bump in their lib.rs). Track via
                # a follow-up issue and re-add the entry once matrix-sdk
                # ships a build that type-checks at the default 128 limit
                # or we patch them via [patch.crates-io].
                include:
                    - name: no-default-features
                      args: --no-default-features
                      install_libudev: false
                    - name: hardware-only
                      args: --no-default-features --features hardware
                      install_libudev: false
                    - name: browser-native
                      args: --no-default-features --features browser-native
                      install_libudev: false
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
            - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
              with:
                  toolchain: 1.92.0
            - uses: Swatinem/rust-cache@v2
              with:
                  key: features-${{ matrix.name }}
            - name: Install Linux system dependencies for all-features
              if: matrix.install_libudev
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends libudev-dev pkg-config
            - name: Check feature combination
              run: cargo check --locked ${{ matrix.args }}

    e2e:
        name: E2E
        needs: [changes, lint]
        # Was push-only: an end-to-end regression was invisible until it was
        # already on `main`. ~2.5 minutes, shorter than `test` and `build`, so
        # it hides behind them.
        if: needs.changes.outputs.rust_changed == 'true' && needs.lint.result == 'success'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
            - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
              with:
                  toolchain: 1.92.0
            - uses: Swatinem/rust-cache@v2
            - name: Run integration / E2E tests
              run: cargo test --test agent_e2e --locked --verbose

    bench-compile:
        name: Bench Compile
        needs: [changes, lint]
        # The one stage that does cost something: ~11 minutes, which makes it
        # the critical path on a Rust PR (previously `build`, ~8). Paid because
        # benches live outside `--lib`/`--bin`, so nothing else notices when a
        # signature change stops them compiling — and `main` went red for it.
        if: needs.changes.outputs.rust_changed == 'true' && needs.lint.result == 'success'
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
            - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
              with:
                  toolchain: 1.92.0
            - uses: Swatinem/rust-cache@v2
            - name: Verify benchmarks compile
              run: cargo bench --no-run --locked

    build:
        name: Build (Smoke)
        needs: [changes]
        if: needs.changes.outputs.rust_changed == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
            - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
              with:
                  toolchain: 1.92.0
            - uses: Swatinem/rust-cache@v2
            - name: Build binary (smoke check)
              run: cargo build --profile release-fast --locked --verbose
            - name: Check binary size
              run: ./scripts/ci/check_binary_size.sh target/release-fast/rantaiclaw

    docs-only:
        name: Docs-Only Fast Path
        needs: [changes]
        if: needs.changes.outputs.docs_only == 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Skip heavy jobs for docs-only change
              run: echo "Docs-only change detected. Rust lint/test/build skipped."

    non-rust:
        name: Non-Rust Fast Path
        needs: [changes]
        if: needs.changes.outputs.docs_only != 'true' && needs.changes.outputs.rust_changed != 'true'
        runs-on: ubuntu-latest
        steps:
            - name: Skip Rust jobs for non-Rust change scope
              run: echo "No Rust-impacting files changed. Rust lint/test/build skipped."

    docs-quality:
        name: Docs Quality
        needs: [changes]
        # Not label-gated: the required gate refuses a docs change whose lint did
        # not pass, on pull requests as well as pushes, so this has to have run.
        if: needs.changes.outputs.docs_changed == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
              with:
                  fetch-depth: 0

            - name: Markdown lint (changed lines only)
              env:
                  BASE_SHA: ${{ needs.changes.outputs.base_sha }}
                  DOCS_FILES: ${{ needs.changes.outputs.docs_files }}
              run: ./scripts/ci/docs_quality_gate.sh

            # ADVISORY (continue-on-error) — plan 261. Also runs on the code side
            # (Lint Gate) so a command added in src/ is caught; here it catches a
            # command dropped from the reference by a docs edit. Flip to blocking
            # once the command reference is complete (J5/J6).
            - name: Every CLI command is documented (advisory)
              continue-on-error: true
              run: ./scripts/ci/docs_command_coverage.sh

            - name: Collect added links
              id: collect_links
              shell: bash
              env:
                  BASE_SHA: ${{ needs.changes.outputs.base_sha }}
                  DOCS_FILES: ${{ needs.changes.outputs.docs_files }}
              run: |
                  set -euo pipefail
                  python3 ./scripts/ci/collect_changed_links.py \
                    --base "$BASE_SHA" \
                    --docs-files "$DOCS_FILES" \
                    --output .ci-added-links.txt
                  count=$(wc -l < .ci-added-links.txt | tr -d ' ')
                  echo "count=$count" >> "$GITHUB_OUTPUT"
                  if [ "$count" -gt 0 ]; then
                    echo "Added links queued for check:"
                    cat .ci-added-links.txt
                  else
                    echo "No added links found in changed docs lines."
                  fi

            - name: Link check (offline, added links only)
              if: steps.collect_links.outputs.count != '0'
              uses: lycheeverse/lychee-action@a8c4c7cb88f0c7386610c35eb25108e448569cb0 # v2
              with:
                  fail: true
                  args: >-
                      --offline
                      --no-progress
                      --format detailed
                      .ci-added-links.txt
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Skip link check (no added links)
              if: steps.collect_links.outputs.count == '0'
              run: echo "No added links in changed docs lines. Link check skipped."

    lint-feedback:
        name: Lint Feedback
        if: github.event_name == 'pull_request'
        needs: [changes, lint, docs-quality]
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
            issues: write
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

            - name: Post actionable lint failure summary
              if: always()
              uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
              env:
                  RUST_CHANGED: ${{ needs.changes.outputs.rust_changed }}
                  DOCS_CHANGED: ${{ needs.changes.outputs.docs_changed }}
                  LINT_RESULT: ${{ needs.lint.result }}
                  LINT_DELTA_RESULT: ${{ needs.lint.result }}
                  DOCS_RESULT: ${{ needs.docs-quality.result }}
              with:
                  script: |
                      const script = require('./.github/workflows/scripts/lint_feedback.js');
                      await script({github, context, core});

    ci-required:
        name: CI Required Gate
        if: always()
        needs:
            [
                changes,
                identity,
                lint,
                test,
                channel-lark,
                features,
                e2e,
                bench-compile,
                build,
                docs-only,
                non-rust,
                docs-quality,
                lint-feedback,
            ]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

            # The decision table this job enforces, checked before it is used.
            # The gate used to be inlined here, which is how it came to run two
            # jobs it never read.
            - name: Self-test the gate
              run: ./scripts/ci/required_gate.sh --self-test

            - name: Enforce required status
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  RUST_CHANGED: ${{ needs.changes.outputs.rust_changed }}
                  DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
                  DOCS_CHANGED: ${{ needs.changes.outputs.docs_changed }}
                  IDENTITY_RESULT: ${{ needs.identity.result }}
                  LINT_RESULT: ${{ needs.lint.result }}
                  TEST_RESULT: ${{ needs.test.result }}
                  CHANNEL_LARK_RESULT: ${{ needs.channel-lark.result }}
                  FEATURES_RESULT: ${{ needs.features.result }}
                  E2E_RESULT: ${{ needs.e2e.result }}
                  BENCH_COMPILE_RESULT: ${{ needs.bench-compile.result }}
                  BUILD_RESULT: ${{ needs.build.result }}
                  DOCS_RESULT: ${{ needs.docs-quality.result }}
              run: ./scripts/ci/required_gate.sh
