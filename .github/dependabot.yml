version: 2

# `open-pull-requests-limit` is a dam, not a throttle. Each ecosystem below sat
# at its limit for months — cargo 3/3 (#23 from 2026-04-20, #83, #86), actions
# 1/1 (#50) and docker 1/1 (#11) — so no newer update, security or otherwise,
# could be opened at all until a human cleared one by hand. The limits are
# raised so a single stale or conflicting pull request cannot hold the whole
# queue shut; review load is managed by grouping, which is already configured.

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: daily
    target-branch: main
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      # These crate families must move together, because their crates cannot
      # compile at mismatched versions. Dependabot opened them as split PRs
      # before (#935 and #939 for opentelemetry, like #762 earlier).
      opentelemetry:
        patterns:
          - "opentelemetry"
          - "opentelemetry_sdk"
          - "opentelemetry-otlp"
        update-types:
          - major
          - minor
          - patch
      russh:
        patterns:
          - "russh"
          - "russh-keys"
          - "russh-sftp"
        update-types:
          - major
          - minor
          - patch
      rust-all:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    target-branch: main
    open-pull-requests-limit: 5
    labels:
      - "ci"
      - "dependencies"
    groups:
      actions-all:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: daily
    target-branch: main
    open-pull-requests-limit: 3
    labels:
      - "ci"
      - "dependencies"
    groups:
      docker-all:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
